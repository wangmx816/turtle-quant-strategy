name: Daily Data Update

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 工作日 18:30 UTC+8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Tushare token
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error::缺少 Secrets.TUSHARE_TOKEN。请到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi
          echo "TUSHARE_TOKEN is set."

      - name: Fetch latest quotes (Tushare)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DATA_SOURCE: tushare
        run: python src/data_fetch.py

      - name: Build dashboard outputs
        env:
          MPLBACKEND: Agg
        run: python dashboard/build_dashboard.py --json-only

      - name: Build playground
        run: python playground/build_playground.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html playground/index.html playground/assets/ \
            output/best_params.json output/comparison.csv output/param_grid_*.csv output/summary_*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
